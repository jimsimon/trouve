[workspace]
members = ["."]
resolver = "2"

# scripts/sync_versions.py mirrors the root release version here. The root
# workspace version remains the sole manually edited product version.
[workspace.package]
version = "3.7.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/jimsimon/trouve"
rust-version = "1.92"

[workspace.dependencies]
trouve-client-core = { path = "../trouve-client-core", version = "3.7.0" }
trouve-desktop-host = { path = "../trouve-desktop-host", version = "3.7.0" }
trouve-protocol = { path = "../trouve-protocol", version = "3.7.0" }

[package]
name = "trouve-servo-embed-preview"
version.workspace = true
edition.workspace = true
description = "Disposable chrome-free Servo embedding qualification harness for trouve."
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
anyhow = "1.0.103"
arboard = { version = "3.6.1", features = ["wayland-data-control"] }
euclid = "0.22"
keepawake = "0.6.0"
mime_guess = "2.0.5"
notify-rust = "4.18.0"
open = "5.3.6"
png = "0.18.1"
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal", "pollster"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# Latest successful upstream nightly when this qualification pin was refreshed:
# https://github.com/servo/servo-nightly-builds/releases/tag/2026-08-02
servo = { git = "https://github.com/servo/servo.git", rev = "42892b088a2ea622cd07786416545f7cd20f76ae", default-features = false, features = ["baked-in-resources", "bundled_freetype", "js_jit"] }
tempfile = "3.27.0"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
trouve-client-core.workspace = true
trouve-desktop-host.workspace = true
trouve-protocol.workspace = true
url = "2"
winit = "=0.30.13"
