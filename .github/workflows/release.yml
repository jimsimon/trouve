name: Release

# Every first-party artifact uses the root workspace version, and repository
# releases use `vX.Y.Z`. The workflow publishes the desktop and server
# binaries, search packages, and review containers; all workspace package
# versions advance together.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  # A manual run repairs binary assets on an existing release. Set the
  # explicit recovery switch to also publish any missing immutable crates.
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vX.Y.Z release tag to rebuild
        required: true
        type: string
      publish_crates:
        description: Publish missing crates.io packages for this tag
        required: false
        default: false
        type: boolean

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

permissions:
  # Build and verification jobs only need to read repository contents.
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  # The release tag and every first-party manifest must match the canonical
  # root workspace version — one version everywhere, always.
  verify-versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14.7"
      - name: Manifests in sync and tag matches workspace version
        run: |
          python3 scripts/sync_versions.py --check
          workspace="$(python3 -c "import tomllib; print(tomllib.load(open('Cargo.toml', 'rb'))['workspace']['package']['version'])")"
          if [ "$RELEASE_TAG" != "v$workspace" ]; then
            echo "Tag $RELEASE_TAG does not match workspace version $workspace" >&2
            exit 1
          fi

  build-desktop-ui:
    needs: verify-versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/app-ui/package-lock.json
      - name: Build desktop UI
        working-directory: web/app-ui
        run: |
          npm ci
          npm run build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-ui-build
          path: web/app-ui/dist/desktop
          if-no-files-found: error

  build-compliance:
    needs: verify-versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG }}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/app-ui/package-lock.json
      - name: Generate release compliance artifacts
        run: |
          mkdir -p target/release-compliance
          python3 scripts/generate_rust_third_party_notices.py \
            --check --sbom target/release-compliance/rust-sbom.cdx.json
          cp THIRD_PARTY_NOTICES.md target/release-compliance/THIRD_PARTY_NOTICES-RUST.md
      - name: Generate frontend compliance artifacts
        working-directory: web/app-ui
        run: |
          npm ci
          npm run verify:notices
          npm run generate:sbom
          cp THIRD_PARTY_NOTICES.md ../../target/release-compliance/THIRD_PARTY_NOTICES-WEB.md
          cp dist/npm-sbom.cdx.json ../../target/release-compliance/npm-sbom.cdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-compliance
          path: target/release-compliance
          if-no-files-found: error

  build-artifacts:
    name: Build release artifacts (${{ matrix.target }})
    needs: [verify-versions, build-desktop-ui]
    strategy:
      fail-fast: false
      matrix:
        include:
          # App, server, and search share one target directory on the six
          # desktop targets so common dependencies compile only once.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            app: true
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            app: true
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            cross: true
            app: false
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            cross: true
            app: false
          - target: aarch64-apple-darwin
            os: macos-latest
            app: true
          - target: x86_64-apple-darwin
            os: macos-latest
            app: true
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            app: true
          - target: aarch64-pc-windows-msvc
            os: windows-11-arm
            app: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG }}
      - name: Install Linux native build dependencies
        if: matrix.app && runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libfontconfig1-dev libdbus-1-dev libgtk-3-dev libwebkit2gtk-4.1-dev
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        if: matrix.app
        with:
          name: desktop-ui-build
          path: web/app-ui/dist/desktop
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: release-target-${{ matrix.target }}
          cache-on-failure: true
          cache-bin: false
      - name: Install cross
        if: matrix.cross
        uses: taiki-e/install-action@5b4d68e2e660441203ab128a23676f1e4faf1532 # v2
        with:
          tool: cross
      - name: Build release artifacts
        if: github.event_name == 'push'
        run: >-
          ${{ matrix.cross && 'cross' || 'cargo' }} build --locked --release
          --package trouve-server
          --package trouve-search
          ${{ matrix.app && '--package trouve-app' || '' }}
          --target ${{ matrix.target }}
        env:
          TROUVE_APP_UI_DIST: ${{ github.workspace }}/web/app-ui/dist/desktop
      # Manual runs backfill only application and server binaries. Existing
      # search assets stay byte-for-byte unchanged.
      - name: Build backfill artifacts
        if: github.event_name == 'workflow_dispatch'
        run: >-
          ${{ matrix.cross && 'cross' || 'cargo' }} build --locked --release
          --package trouve-server
          ${{ matrix.app && '--package trouve-app' || '' }}
          --target ${{ matrix.target }}
        env:
          TROUVE_APP_UI_DIST: ${{ github.workspace }}/web/app-ui/dist/desktop
      - name: Package trouve-server (unix)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf "trouve-server-${RELEASE_TAG}-${{ matrix.target }}.tar.gz" trouve-server
      - name: Package trouve-server (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cd target/${{ matrix.target }}/release
          Compress-Archive -Path trouve-server.exe -DestinationPath "trouve-server-$env:RELEASE_TAG-${{ matrix.target }}.zip"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trouve-server-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/trouve-server-${{ env.RELEASE_TAG }}-${{ matrix.target }}.tar.gz
            target/${{ matrix.target }}/release/trouve-server-${{ env.RELEASE_TAG }}-${{ matrix.target }}.zip
          if-no-files-found: error
      - name: Package trouve (unix)
        if: matrix.app && runner.os != 'Windows'
        run: |
          release_dir="target/${{ matrix.target }}/release"
          if [ "$RUNNER_OS" = Linux ]; then
            package_root="$release_dir/trouve-linux-package"
            mkdir -p \
              "$package_root/bin" \
              "$package_root/share/applications" \
              "$package_root/share/icons/hicolor/512x512/apps"
            install -m 0755 "$release_dir/trouve" "$package_root/bin/trouve"
            install -m 0644 packaging/linux/trouve.desktop \
              "$package_root/share/applications/trouve.desktop"
            install -m 0644 crates/trouve-app/assets/trouve.png \
              "$package_root/share/icons/hicolor/512x512/apps/trouve.png"
            cat > "$package_root/TROUVE-LINUX-README.txt" <<'EOF'
          Trouve's Linux desktop uses the system GTK 3 and WebKitGTK 4.1 runtime.
          Debian/Ubuntu users should install the accompanying .deb package, which
          declares these dependencies. For the tar archive, install:
            libwebkit2gtk-4.1-0 libgtk-3-0 libdbus-1-3 libfontconfig1
          The archive's share/ directory contains the desktop entry and icon for
          installation below /usr/local or another XDG data prefix. Extract the
          archive into that prefix so bin/trouve is available on PATH:
            sudo tar -C /usr/local -xzf trouve-vX.Y.Z-<target>.tar.gz
          EOF
            tar -C "$package_root" -czf \
              "$GITHUB_WORKSPACE/$release_dir/trouve-${RELEASE_TAG}-${{ matrix.target }}.tar.gz" \
              bin TROUVE-LINUX-README.txt share
          else
            tar -C "$release_dir" -czf \
              "$GITHUB_WORKSPACE/$release_dir/trouve-${RELEASE_TAG}-${{ matrix.target }}.tar.gz" \
              trouve
          fi
      - name: Package trouve for Debian-compatible Linux
        if: matrix.app && runner.os == 'Linux'
        shell: bash
        run: |
          case "${{ matrix.target }}" in
            x86_64-unknown-linux-gnu) deb_arch=amd64 ;;
            aarch64-unknown-linux-gnu) deb_arch=arm64 ;;
            *) echo "unsupported Debian target: ${{ matrix.target }}" >&2; exit 1 ;;
          esac
          package_root="target/${{ matrix.target }}/release/debian-package"
          mkdir -p \
            "$package_root/DEBIAN" \
            "$package_root/usr/bin" \
            "$package_root/usr/share/applications" \
            "$package_root/usr/share/icons/hicolor/512x512/apps"
          install -m 0755 "target/${{ matrix.target }}/release/trouve" \
            "$package_root/usr/bin/trouve"
          install -m 0644 packaging/linux/trouve.desktop \
            "$package_root/usr/share/applications/trouve.desktop"
          install -m 0644 crates/trouve-app/assets/trouve.png \
            "$package_root/usr/share/icons/hicolor/512x512/apps/trouve.png"
          cat > "$package_root/DEBIAN/control" <<EOF
          Package: trouve
          Version: ${RELEASE_TAG#v}
          Architecture: $deb_arch
          Maintainer: Trouve contributors
          Depends: libwebkit2gtk-4.1-0, libgtk-3-0, libdbus-1-3, libfontconfig1
          Section: devel
          Priority: optional
          Description: Trouve AI coding harness desktop application
          EOF
          dpkg-deb --build --root-owner-group "$package_root" \
            "target/${{ matrix.target }}/release/trouve-${RELEASE_TAG}-${{ matrix.target }}.deb"
      - name: Package trouve (windows)
        if: matrix.app && runner.os == 'Windows'
        shell: pwsh
        run: |
          cd target/${{ matrix.target }}/release
          Compress-Archive -Path trouve.exe -DestinationPath "trouve-$env:RELEASE_TAG-${{ matrix.target }}.zip"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: matrix.app
        with:
          name: trouve-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/trouve-${{ env.RELEASE_TAG }}-${{ matrix.target }}.tar.gz
            target/${{ matrix.target }}/release/trouve-${{ env.RELEASE_TAG }}-${{ matrix.target }}.zip
            target/${{ matrix.target }}/release/trouve-${{ env.RELEASE_TAG }}-${{ matrix.target }}.deb
          if-no-files-found: error
      # Search artifact names keep the historical
      # `trouve-search-vX.Y.Z-<target>` shape.
      - name: Package trouve-search (unix)
        if: github.event_name == 'push' && runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf "trouve-search-${RELEASE_TAG}-${{ matrix.target }}.tar.gz" trouve-search
      - name: Package trouve-search (windows)
        if: github.event_name == 'push' && runner.os == 'Windows'
        shell: pwsh
        run: |
          cd target/${{ matrix.target }}/release
          Compress-Archive -Path trouve-search.exe -DestinationPath "trouve-search-$env:RELEASE_TAG-${{ matrix.target }}.zip"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: github.event_name == 'push'
        with:
          name: trouve-search-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/trouve-search-${{ env.RELEASE_TAG }}-${{ matrix.target }}.tar.gz
            target/${{ matrix.target }}/release/trouve-search-${{ env.RELEASE_TAG }}-${{ matrix.target }}.zip
          if-no-files-found: error

  release:
    needs: [build-artifacts, build-compliance]
    runs-on: ubuntu-latest
    permissions:
      # softprops/action-gh-release uploads assets to the repository release.
      contents: write
    steps:
      - name: Download compliance artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-compliance
          path: artifacts
      - name: Download binary artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: trouve-*
          path: artifacts
          merge-multiple: true
      - name: Download existing search assets for backfill checksums
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          search_asset_count="$(gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json assets \
            --jq '[.assets[].name | select(startswith("trouve-search-"))] | length')"
          if [ "$search_asset_count" -gt 0 ]; then
            gh release download "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --dir existing-artifacts \
              --pattern 'trouve-search-*'
          fi
      - name: Generate checksums
        run: |
          checksum_file="$(mktemp)"
          (
            cd artifacts
            find . -maxdepth 1 -type f -printf '%P\0' \
              | sort -z \
              | xargs -0 -r sha256sum
            if [ -d ../existing-artifacts ]; then
              cd ../existing-artifacts
              find . -maxdepth 1 -type f -printf '%P\0' \
                | sort -z \
                | xargs -0 -r sha256sum
            fi
          ) | sort -k2 > "$checksum_file"
          mv "$checksum_file" artifacts/SHA256SUMS
      # Attaches to the existing release when one was published from the UI;
      # creates the release when the run came from a pushed tag.
      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: artifacts/*
          # Existing release notes are user-authored state. Manual backfills
          # only attach assets; tag-triggered releases still generate notes.
          generate_release_notes: ${{ github.event_name == 'push' }}

  publish-containers:
    needs: release
    if: github.event_name == 'push'
    runs-on: ${{ matrix.runner }}
    permissions:
      # Checkout reads repository contents; image publication writes GHCR packages.
      contents: read
      packages: write
    strategy:
      fail-fast: false
      # Build on matching native hardware; the manifest job below joins the
      # architecture-specific images under the public version and SHA tags.
      matrix:
        include:
          - component: server
            context: container-server
            dockerfile: container-server/Dockerfile
            image: trouve-server
            runner: ubuntu-latest
            platform: linux/amd64
            arch: amd64
            target: x86_64-unknown-linux-musl
          - component: server
            context: container-server
            dockerfile: container-server/Dockerfile
            image: trouve-server
            runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
            target: aarch64-unknown-linux-musl
          - component: review-ui
            context: web/review-ui
            dockerfile: web/review-ui/Dockerfile
            image: trouve-review-ui
            runner: ubuntu-latest
            platform: linux/amd64
            arch: amd64
          - component: review-ui
            context: web/review-ui
            dockerfile: web/review-ui/Dockerfile
            image: trouve-review-ui
            runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        if: matrix.component == 'server'
        with:
          name: trouve-server-${{ matrix.target }}
          path: server-artifact
      - name: Prepare prebuilt server image context
        if: matrix.component == 'server'
        shell: bash
        run: |
          mkdir -p container-server
          tar xzf \
            "server-artifact/trouve-server-${RELEASE_TAG}-${{ matrix.target }}.tar.gz" \
            -C container-server
          cp Dockerfile.server.release container-server/Dockerfile
      - name: Resolve release version
        id: version
        shell: bash
        run: echo "value=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=${{ steps.version.outputs.value }}-${{ matrix.arch }}
            type=raw,value=sha-${{ github.sha }}-${{ matrix.arch }}
      - name: Build and publish
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.component }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}-${{ matrix.arch }}

  publish-container-manifests:
    needs: publish-containers
    runs-on: ubuntu-latest
    permissions:
      # Required to read architecture images and publish manifests in GHCR.
      packages: write
    strategy:
      matrix:
        image: [trouve-server, trouve-review-ui]
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - name: Publish multi-platform manifests
        shell: bash
        env:
          IMAGE: ${{ matrix.image }}
          IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}
          SHA_TAG: sha-${{ github.sha }}
        run: |
          version="${RELEASE_TAG#v}"
          for tag in "$version" "$SHA_TAG"; do
            docker buildx imagetools create \
              --tag "${IMAGE_PREFIX}/${IMAGE}:${tag}" \
              "${IMAGE_PREFIX}/${IMAGE}:${tag}-amd64" \
              "${IMAGE_PREFIX}/${IMAGE}:${tag}-arm64"
          done

  # Mutable tags reconcile separately from release-scoped immutable builds.
  # GitHub may coalesce pending jobs in this shared group; that is safe because
  # every publisher starts after both multi-platform versioned images exist and
  # revalidates releases/latest while holding the global publisher slot.
  publish-latest-containers:
    needs: publish-container-manifests
    runs-on: ubuntu-latest
    concurrency:
      group: release-latest-containers
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - name: Publish current release as latest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}
        run: |
          latest_tag="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name)"
          if [ "$latest_tag" != "$RELEASE_TAG" ]; then
            exit 0
          fi
          version="${RELEASE_TAG#v}"
          for image in trouve-server trouve-review-ui; do
            docker buildx imagetools create \
              --tag "${IMAGE_PREFIX}/${image}:latest" \
              "${IMAGE_PREFIX}/${image}:${version}"
          done

  publish-crate:
    needs: release
    if: github.event_name == 'push' || inputs.publish_crates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish to crates.io
        shell: bash
        run: |
          version="${RELEASE_TAG#v}"

          published() {
            cargo info --registry crates-io "$1@$version" >/dev/null 2>&1
          }

          publish_with_retries() {
            local crate="$1"
            local attempts="$2"
            local attempt
            for attempt in $(seq 1 "$attempts"); do
              if published "$crate"; then
                echo "$crate@$version is already published; skipping."
                return 0
              fi
              if cargo publish --locked --package "$crate"; then
                return 0
              fi
              if published "$crate"; then
                echo "$crate@$version was published despite a transient client error."
                return 0
              fi
              if [ "$attempt" -lt "$attempts" ]; then
                echo "Publish attempt $attempt for $crate@$version failed; retrying in 10 seconds." >&2
                sleep 10
              fi
            done
            return 1
          }

          publish_with_retries trouve-process 6

          # crates.io may accept a crate before its sparse index entry is visible
          # to a dependent package. Wait for that entry before publishing search.
          for attempt in $(seq 1 18); do
            if published trouve-process; then
              break
            fi
            if [ "$attempt" -eq 18 ]; then
              echo "trouve-process@$version did not become visible on crates.io." >&2
              exit 1
            fi
            sleep 10
          done

          publish_with_retries trouve-search 6
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # Publish platform packages, @trouve-ai/search-core, then search-plugin.
  publish-npm:
    needs: release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # npm provenance attestations are signed with the job's OIDC token.
      id-token: write
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts
          merge-multiple: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Stage platform binaries
        run: python3 scripts/stage_npm_binaries.py artifacts
      - name: Publish npm packages (platforms in parallel)
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "NPM_TOKEN is not configured; skipping npm publishes." >&2
            exit 0
          fi
          publish_if_new() {
            local dir="$1"
            local name version
            name="$(node -p "require('./$dir/package.json').name")"
            version="$(node -p "require('./$dir/package.json').version")"
            if [ "$(npm view "$name@$version" version 2>/dev/null)" = "$version" ]; then
              echo "$name@$version already published; skipping."
              return
            fi
            echo "Publishing $name@$version from $dir"
            (cd "$dir" && npm publish --access public --provenance)
          }
          wait_for_platform() {
            if ! wait "$1"; then
              platform_publish_failed=1
            fi
          }
          platform_publish_failed=0
          platform_pids=()
          shopt -s nullglob
          for pkg in npm/search-*/package.json; do
            dir="$(dirname "$pkg")"
            case "$dir" in
              npm/search-core|npm/search-plugin) continue ;;
            esac
            while [ "${#platform_pids[@]}" -ge 4 ]; do
              wait_for_platform "${platform_pids[0]}"
              platform_pids=("${platform_pids[@]:1}")
            done
            publish_if_new "$dir" &
            platform_pids+=("$!")
          done
          for pid in "${platform_pids[@]}"; do
            wait_for_platform "$pid"
          done
          if [ "$platform_publish_failed" -ne 0 ]; then
            echo "One or more platform package publishes failed." >&2
            exit 1
          fi
          publish_if_new npm/search-core
          publish_if_new npm/search-plugin
