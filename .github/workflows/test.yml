name: Test

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

# Every job only checks out, builds, tests, and caches.
permissions:
  contents: read

# Cancel superseded PR runs: they waste runner time and race the winners
# to save the same rust-cache key, which discards the losers' cache saves.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install Linux native build dependencies
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libfontconfig1-dev libdbus-1-dev libgtk-3-dev libwebkit2gtk-4.1-dev
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: release-target-${{ matrix.target }}
          cache-on-failure: true
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: github.ref == 'refs/heads/main'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/app-ui/package-lock.json
      - name: Build desktop UI for the cached release app
        if: github.ref == 'refs/heads/main'
        working-directory: web/app-ui
        run: |
          npm ci
          npm run build
      - name: Unit and integration tests (offline)
        run: cargo test --workspace
      # Match the release job's package set and target on trusted main pushes.
      # Later tags can restore the release-profile dependency outputs.
      - name: Build and cache release artifacts
        if: github.ref == 'refs/heads/main'
        run: >-
          cargo build --locked --release
          --package trouve-server
          --package trouve-search
          --package trouve-app
          --target ${{ matrix.target }}
        env:
          TROUVE_APP_UI_DIST: ${{ github.workspace }}/web/app-ui/dist/desktop

  # Windows-only dependencies and trait impls must be compiled on Windows.
  # Pull requests check the release profile so they can reuse the dependency
  # artifacts seeded by trusted main pushes and release tags.
  windows-check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: release-target-x86_64-pc-windows-msvc
          cache-on-failure: true
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Check Windows desktop app
        if: github.event_name == 'pull_request'
        run: >-
          cargo check --locked --release --package trouve-app
          --target x86_64-pc-windows-msvc
      - name: Build and cache Windows release artifacts
        if: github.ref == 'refs/heads/main'
        run: >-
          cargo build --locked --release
          --package trouve-server
          --package trouve-search
          --package trouve-app
          --target x86_64-pc-windows-msvc

  # Opt-in tests: model-backed search and title-quality coverage plus loopback
  # protocol client coverage. These crates hold every #[ignore]d test in the
  # workspace (enforced by the "ignored tests" check in lint.yml); none pulls
  # in the desktop GUI crates, so this job needs no fontconfig/dbus packages.
  test-with-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          # Restore the main test job's cache instead of consuming quota with
          # another job- and PR-scoped copy of the same dependency graph.
          shared-key: release-target-x86_64-unknown-linux-gnu
          cache-on-failure: true
          cache-bin: false
          save-if: false
      - name: Cache embedding model
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: hf-potion-code-16m
      - name: Cache session naming runtime and model
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/trouve-title-e2e
          key: ${{ runner.os }}-title-model-qwen3-1.7b-q5-k-m-bartowski-v1
      - name: Model-backed end-to-end tests
        run: cargo test -p trouve-search -- --ignored
        env:
          TROUVE_E2E: "1"
      - name: Protocol client network tests
        run: cargo test -p trouve-client-core -- --ignored
        env:
          TROUVE_E2E: "1"
      - name: Session title model quality tests
        run: cargo test -p trouve-core local_title_model_preserves_intent_and_subject -- --ignored
        env:
          TROUVE_E2E: "1"
          TROUVE_TITLE_E2E_DATA_DIR: ${{ runner.temp }}/trouve-title-e2e

  # Numeric/behavioural parity against the upstream Python implementation.
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: release-target-x86_64-unknown-linux-gnu
          cache-on-failure: true
          cache-bin: false
          save-if: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Cache embedding model
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: hf-potion-code-16m
      - name: Fetch upstream reference
        run: ./scripts/fetch-reference.sh
      - name: Install upstream semble
        # The parity harness imports bm25s directly. Keep its known-good
        # version explicit now that semble no longer depends on it.
        run: pip install './reference/semble[mcp]' 'bm25s==0.3.9'
      - name: Build release binary
        run: cargo build --release --package trouve-search
      - name: Run parity harness
        run: python3 crates/trouve-search/tests/parity/run_parity.py --binary target/release/trouve-search
